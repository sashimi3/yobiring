limit_req_zone $binary_remote_addr zone=bell:1m rate=6r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # アクセス制限(iPad 向け)。[A] [B] のどちらかを有効化する
    #
    # [A] IP 許可: 受付ネットワークのグローバル IP を列挙
    # allow 192.168.1.0/24;
    # deny all;
    #
    # [B] Basic 認証: compose.yaml の .htpasswd マウントも有効化する
    # auth_basic "reception";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    #
    # [A] と [B] を両方有効にして、どちらか一方を満たせば通す場合
    # satisfy any;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # worker 向け。Bearer トークンで認証するので nginx の制限は外す
    location /internal/ {
        allow all;
        auth_basic off;
        proxy_pass http://api:8000;
    }

    location = /api/call {
        limit_req zone=bell burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
    }

    location /api/ {
        proxy_pass http://api:8000;
    }

    # Vite のビルド成果物はファイル名にハッシュが付くので長期キャッシュ
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
